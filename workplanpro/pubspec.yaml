name: workplanpro
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.6

  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  file_picker: ^5.0.0
  image_picker: ^1.1.2
  path: ^1.8.0
  cached_network_image: ^3.4.1

  cupertino_icons: ^1.0.8
  permission_handler: ^10.0.0

  form_field_validator: ^1.1.0
  logger: ^2.4.0
  connectivity_plus: ^6.1.0

  lottie: ^3.1.3
  animated_text_kit: ^4.2.2

  motion_tab_bar: ^2.0.4
  motion_tab_bar_v2: ^0.3.0
  firebase_database: ^11.1.6

  email_validator: ^3.0.0
  shimmer: ^3.0.0

  provider: ^6.1.2
  firebase_crashlytics: ^4.1.5
  firebase_app_check: ^0.3.1+6
  logging: ^1.3.0
  firebase_analytics: ^11.3.5

  device_info_plus: ^11.1.1
  package_info_plus: ^8.1.1
  synchronized: ^3.3.0+3
  firebase_performance: ^0.10.0+10
  google_api_availability: ^5.0.0

  google_sign_in: ^6.2.2
  local_auth: ^2.3.0

  rxdart: ^0.27.7
  intl: ^0.19.0
  table_calendar: ^3.1.2

  flutter_animate: ^4.5.2
  font_awesome_flutter: ^10.8.0
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "./android/assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "./android/assets/icon/icon.png"

