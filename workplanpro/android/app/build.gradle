plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services' // ใช้เพียงครั้งเดียว
}

android {
    namespace = "com.example.workplanpro"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.example.workplanpro"
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation(platform("com.google.firebase:firebase-bom:33.5.1"))
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation("com.google.firebase:firebase-auth")
    implementation("com.google.android.gms:play-services-auth:21.2.0")
    
    // เพิ่ม Firebase Firestore หากต้องการ
    // implementation("com.google.firebase:firebase-firestore")
    
    // เพิ่ม Firebase Analytics หากต้องการ
    // implementation("com.google.firebase:firebase-analytics")
    
    // เพิ่ม Firebase Crashlytics หากต้องการ
    // implementation("com.google.firebase:firebase-crashlytics")
}